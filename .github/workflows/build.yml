name: Build ARM64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;34.0.0 ndk;26.1.10909125 platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle 8.5
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ARM64 Release APK
        run: ./gradlew :app:assembleRelease --no-daemon -Pandroid.abiFilters=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}